<!DOCTYPE html>
<html class="dark" dir="rtl" lang="ar">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>تعيين كلمة المرور الجديدة | الموقع الشخصي</title>
  
  <!-- أيقونة الموقع الرسمية المعتمدة بالخلفية السوداء الكاملة ودون أي قص -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/aida-public/AB6AXuDTU-9Xh0x-i9l7kF_vS91_e53655160b7d"/>
  <link rel="shortcut icon" type="image/png" href="https://lh3.googleusercontent.com/aida-public/AB6AXuDTU-9Xh0x-i9l7kF_vS91_e53655160b7d"/>
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/aida-public/AB6AXuDTU-9Xh0x-i9l7kF_vS91_e53655160b7d"/>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; min-height: 100vh; }
    }
    ::-webkit-scrollbar { display: none; }
    .font-arabic { font-family: 'Alexandria', sans-serif; }
  </style>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#0e0d0c",
            "surface": "#141312",
            "surface-container-lowest": "#0b0a09",
            "surface-container-low": "#181716",
            "surface-container": "#201e1d",
            "surface-container-high": "#2a2826",
            "surface-container-highest": "#353331",
            "primary": "#f2ca50",
            "primary-container": "#d4af37",
            "outline": "#99907c",
            "outline-variant": "#413b2c",
            "on-surface": "#f5f2ee",
            "on-surface-variant": "#c9c2b0"
          },
          fontFamily: {
            sans: ['Alexandria', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>

<body class="bg-background font-arabic text-on-surface antialiased min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-primary/20 selection:text-primary">
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[650px] h-[450px] bg-gradient-to-b from-primary/15 via-primary-container/5 to-transparent rounded-full blur-[140px]"></div>
    <div class="absolute bottom-10 left-1/4 w-[380px] h-[380px] bg-primary/5 rounded-full blur-[130px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(rgba(242,202,80,0.04)_1px,transparent_1px)] [background-size:32px_32px] opacity-70"></div>
  </div>

  <main class="w-full max-w-md mx-auto">
    <div class="rounded-3xl bg-surface-container/85 border border-outline-variant/50 backdrop-blur-2xl p-7 sm:p-9 shadow-2xl relative overflow-hidden">
      <div class="absolute inset-x-0 top-0 h-[1.5px] bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>

      <div class="flex items-center justify-between mb-6 pb-4 border-b border-outline-variant/30">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-primary"></span>
          <h1 class="text-xl font-bold text-on-surface tracking-wide">تعيين كلمة المرور الجديدة</h1>
        </div>
        <a href="index.html#login" class="text-xs text-outline hover:text-primary flex items-center gap-1 transition-colors">
          <span>تسجيل الدخول</span>
          <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        </a>
      </div>

      <div class="p-3.5 rounded-2xl bg-surface-container-lowest/80 border border-primary/40 text-xs text-on-surface flex items-center gap-2.5 mb-5 shadow-inner">
        <span class="material-symbols-outlined text-primary text-[22px]">verified</span>
        <span class="font-medium leading-relaxed">تم التحقق من رابط الاستعادة بنجاح. يمكنك الآن تعيين كلمة المرور الجديدة.</span>
      </div>

      <form class="space-y-4" onsubmit="handleResetSubmit(event)">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">كلمة المرور الجديدة</label>
          <div class="relative flex items-center">
            <input class="w-full h-11 pr-3.5 pl-11 rounded-xl bg-surface-container-lowest border border-outline-variant/50 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="newPass" minlength="6" placeholder="••••••••" required type="password"/>
            <button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center p-1 cursor-pointer" onclick="togglePassVisibility('newPass', this)" type="button">
              <span class="material-symbols-outlined text-[19px]">visibility</span>
            </button>
          </div>
          <span class="text-[11px] text-outline mt-1 block">يجب ألا تقل عن 6 خانات</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">تأكيد كلمة المرور الجديدة</label>
          <div class="relative flex items-center">
            <input class="w-full h-11 pr-3.5 pl-11 rounded-xl bg-surface-container-lowest border border-outline-variant/50 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="confirmPass" minlength="6" placeholder="••••••••" required type="password"/>
            <button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center p-1 cursor-pointer" onclick="togglePassVisibility('confirmPass', this)" type="button">
              <span class="material-symbols-outlined text-[19px]">visibility</span>
            </button>
          </div>
        </div>

        <button class="w-full h-11 rounded-xl bg-surface-container-high hover:bg-surface-container-highest border border-outline-variant/60 text-primary font-bold text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 mt-6 cursor-pointer" id="submitBtn" type="submit">
          <span>حفظ كلمة المرور والتوجه للدخول</span>
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-outline-variant/20 text-center">
        <a href="index.html#login" class="text-xs text-outline hover:text-primary transition-colors inline-flex items-center gap-1">
          <span class="material-symbols-outlined text-[15px]">login</span>
          <span>العودة لصفحة تسجيل الدخول</span>
        </a>
      </div>
    </div>
  </main>

  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-surface-container-highest border border-primary/40 text-on-surface px-5 py-3 rounded-full shadow-2xl flex items-center gap-2.5 opacity-0 pointer-events-none transition-all duration-300 z-50 transform translate-y-3" id="toastNotification">
    <span class="material-symbols-outlined text-primary text-[20px]" id="toastIcon">check_circle</span>
    <span class="text-xs sm:text-sm font-semibold text-on-surface" id="toastMessage">تمت العملية بنجاح</span>
  </div>

  <script>
    const SUPABASE_URL = "https://jzfqyhskxfsfsrglmbac.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZnF5aHNreGZzZnNyZ2xtYmFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDUyMDMsImV4cCI6MjEwNzQ4MTIwM30.5Wx2X8GgXQWQ4_W6vExY3QZ_PhND3T_D68Iq-03LjYE";
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    (function initSession() {
      if (!supabaseClient) return;
      const search = window.location.search || '';
      if (search.includes('code=') && supabaseClient.auth.exchangeCodeForSession) {
        const urlParams = new URLSearchParams(search);
        const code = urlParams.get('code');
        if (code) {
          supabaseClient.auth.exchangeCodeForSession(code);
        }
      }
    })();

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    let toastTimer;
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      if (!toast || !toastMsg) return;

      toastMsg.textContent = message;
      if (toastIcon) {
        toastIcon.textContent = isSuccess ? 'check_circle' : 'error';
        toastIcon.className = isSuccess ? 'material-symbols-outlined text-primary text-[20px]' : 'material-symbols-outlined text-red-400 text-[20px]';
      }

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 3500);
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPass').value;
      const p2 = document.getElementById('confirmPass').value;
      const btn = document.getElementById('submitBtn');

      if (!p1 || p1.length < 6) {
        showToast('كلمة المرور يجب أن تكون 6 خانات على الأقل', false);
        return;
      }
      if (p1 !== p2) {
        showToast('كلمتا المرور غير متطابقتين', false);
        return;
      }
      if (!supabaseClient) {
        showToast('خطأ: تعذر الاتصال بخادم قاعدة البيانات', false);
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');

      try {
        const { data, error } = await supabaseClient.auth.updateUser({
          password: p1
        });

        if (error) {
          showToast(error.message, false);
          btn.disabled = false;
          btn.classList.remove('opacity-50');
        } else {
          showToast('تم حفظ كلمة المرور بنجاح! جاري تحويلك لصفحة تسجيل الدخول...', true);
          setTimeout(() => {
            window.location.href = 'index.html#login';
          }, 1500);
        }
      } catch (err) {
        showToast('حدث خطأ غير متوقع أثناء حفظ كلمة المرور', false);
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
