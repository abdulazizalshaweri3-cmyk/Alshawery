<!DOCTYPE html>
<html class="dark" dir="rtl" lang="ar">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>تعيين كلمة المرور الجديدة | الموقع الشخصي</title>
  
  <!-- الأيقونة الرسمية المعتمدة بالخلفية السوداء الكاملة ودون أي قص -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/aida-public/AB6AXuDTU-9Xh0x-i9l7kF_vS91_e53655160b7d"/>
  <link rel="shortcut icon" type="image/png" href="https://lh3.googleusercontent.com/aida-public/AB6AXuDTU-9Xh0x-i9l7kF_vS91_e53655160b7d"/>
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/aida-public/AB6AXuDTU-9Xh0x-i9l7kF_vS91_e53655160b7d"/>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#0e0d0c",
            "surface": "#141312",
            "surface-container-lowest": "#0b0a09",
            "surface-container": "#201e1d",
            "surface-container-high": "#2a2826",
            "surface-container-highest": "#353331",
            "primary": "#f2ca50",
            "primary-container": "#d4af37",
            "on-surface": "#f5f2ee",
            "on-surface-variant": "#c9c2b0",
            "outline": "#99907c",
            "outline-variant": "#413b2c"
          },
          fontFamily: {
            sans: ['Alexandria', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Alexandria', sans-serif; background-color: #0e0d0c; }
  </style>
</head>

<body class="bg-background text-on-surface min-h-screen flex flex-col justify-between p-4 selection:bg-primary/20 selection:text-primary">
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[500px] bg-gradient-to-b from-primary/15 via-primary-container/5 to-transparent rounded-full blur-[140px]"></div>
  </div>

  <!-- هيدر الصفحة: يحتوي على الزر العلوي للرجوع فقط -->
  <header class="w-full max-w-md mx-auto pt-4 flex justify-between items-center">
    <span class="text-xs font-semibold text-outline">الموقع الشخصي</span>
    <a class="text-xs text-primary hover:underline flex items-center gap-1 font-medium transition-colors" href="index.html#login">
      <span>تسجيل الدخول</span>
      <span class="material-symbols-outlined text-[16px] rotate-180">arrow_forward</span>
    </a>
  </header>

  <!-- بطاقة تعيين كلمة المرور: تم حذف الرابط السفلي نهائياً -->
  <main class="w-full max-w-md mx-auto my-auto py-8">
    <div class="rounded-3xl bg-surface-container/80 border border-outline-variant/50 backdrop-blur-2xl p-6 sm:p-8 shadow-2xl shadow-black/80">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-outline-variant/30">
        <div class="w-10 h-10 rounded-xl bg-surface-container-highest border border-primary/40 text-primary flex items-center justify-center shadow-inner">
          <span class="material-symbols-outlined text-[22px]">lock_reset</span>
        </div>
        <div>
          <h1 class="text-lg font-bold text-on-surface">تعيين كلمة المرور الجديدة</h1>
          <p class="text-xs text-on-surface-variant mt-0.5">أدخل كلمة المرور الجديدة لحسابك لتسجيل الدخول فوراً</p>
        </div>
      </div>

      <form class="space-y-4" id="newPasswordForm" onsubmit="saveNewPassword(event)">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">كلمة المرور الجديدة (6 خانات على الأقل)</label>
          <div class="relative flex items-center">
            <input class="w-full h-11 pr-3.5 pl-11 rounded-xl bg-surface-container-lowest border border-outline-variant/50 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="targetPassword" minlength="6" placeholder="••••••••" required="" type="password"/>
            <button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center p-1" onclick="const inp=document.getElementById('targetPassword'); const ic=this.querySelector('.material-symbols-outlined'); if(inp.type==='password'){ inp.type='text'; ic.textContent='visibility_off'; } else { inp.type='password'; ic.textContent='visibility'; }" title="إظهار/إخفاء" type="button">
              <span class="material-symbols-outlined text-[19px]">visibility</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">تأكيد كلمة المرور الجديدة</label>
          <div class="relative flex items-center">
            <input class="w-full h-11 pr-3.5 pl-11 rounded-xl bg-surface-container-lowest border border-outline-variant/50 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="confirmPassword" minlength="6" placeholder="••••••••" required="" type="password"/>
            <button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center p-1" onclick="const inp=document.getElementById('confirmPassword'); const ic=this.querySelector('.material-symbols-outlined'); if(inp.type==='password'){ inp.type='text'; ic.textContent='visibility_off'; } else { inp.type='password'; ic.textContent='visibility'; }" title="إظهار/إخفاء" type="button">
              <span class="material-symbols-outlined text-[19px]">visibility</span>
            </button>
          </div>
        </div>

        <button class="w-full h-11 rounded-xl bg-surface-container-high hover:bg-surface-container-highest border border-outline-variant/60 text-primary font-bold text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 mt-6 cursor-pointer" id="savePasswordBtn" type="submit">
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
          <span>حفظ كلمة المرور والتوجه للدخول</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="w-full max-w-md mx-auto py-4 text-center text-xs text-outline">
    © 2026 جميع الحقوق محفوظة.
  </footer>

  <div class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-surface-container-highest border border-primary/40 text-on-surface px-5 py-3 rounded-full shadow-2xl flex items-center gap-2.5 opacity-0 pointer-events-none transition-all duration-300 z-50 transform translate-y-3" id="toastNotification">
    <span class="material-symbols-outlined text-primary text-[20px]" id="toastIcon">check_circle</span>
    <span class="text-xs sm:text-sm font-semibold text-on-surface" id="toastMessage">تمت العملية بنجاح</span>
  </div>

  <script>
    const SUPABASE_URL = "https://jzfqyhskxfsfsrglmbac.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6ZnF5aHNreGZzZnNyZ2xtYmFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDUyMDMsImV4cCI6MjEwNzQ4MTIwM30.5Wx2X8GgXQWQ4_W6vExY3QZ_PhND3T_D68Iq-03LjYE";
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let toastTimer;
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      if (!toast || !toastMsg) return;

      toastMsg.textContent = message;
      if (toastIcon) {
        toastIcon.textContent = isSuccess ? 'check_circle' : 'error';
        toastIcon.className = isSuccess ? 'material-symbols-outlined text-primary text-[20px]' : 'material-symbols-outlined text-red-400 text-[20px]';
      }

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 3500);
    }

    async function saveNewPassword(e) {
      e.preventDefault();
      const pass = document.getElementById('targetPassword').value;
      const conf = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('savePasswordBtn');

      if (pass !== conf) {
        showToast('كلمتا المرور غير متطابقتين', false);
        return;
      }

      if (!supabaseClient) {
        showToast('خطأ: تعذر الاتصال بخادم قاعدة البيانات', false);
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: pass });
        if (error) {
          showToast(error.message, false);
        } else {
          showToast('تم حفظ كلمة المرور بنجاح! جاري التوجه لتسجيل الدخول...', true);
          setTimeout(() => {
            window.location.href = 'index.html#login';
          }, 1500);
        }
      } catch (err) {
        showToast('حدث خطأ غير متوقع', false);
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
